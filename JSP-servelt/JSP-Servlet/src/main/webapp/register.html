<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registration Form</title>
</head>
<body>

<form action="register" method="post">
    <level>ID</level>
    <input type="number" name="id" placeholder="Enter your id">
    <br>
    <level>User Name</level>
    <input type="text" name="Username" placeholder="Enter you Name">
    <br>
    <level>Email</level>
    <input type="email" name="Email" placeholder="Enter you email">
    <br>
    <level>Registration NO</level>
    <input type="number" name="redg" placeholder="Enter you regd no">
    <br>
    <label>Password</label>
    <input type="password" name="password" placeholder="Enter your password">
    <br>
    <button type="submit">Register</button>

</form>
</body>
</html>
